services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: healthrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/healthrag
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - hfcache:/models
    depends_on:
      - db

volumes:
  pgdata:
  hfcache: